name: ingestion-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/ingestion/**"
      - "infra/migrations/**"
      - "infra/migrate.py"
      - ".github/workflows/ingestion-ci.yml"
  pull_request:
    paths:
      - "apps/ingestion/**"
      - "infra/migrations/**"
      - "infra/migrate.py"
      - ".github/workflows/ingestion-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: newstack
          POSTGRES_PASSWORD: newstack
          POSTGRES_DB: newstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://newstack:newstack@localhost:5432/newstack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ingestion/requirements.txt

      # sentence-transformers downloads the embedding model from HuggingFace on first use
      # (torch + fasttext-wheel are large wheels too) — cached across runs so this isn't a
      # multi-minute download every time.
      - name: Cache HuggingFace / torch model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ingestion-models-${{ hashFiles('apps/ingestion/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r apps/ingestion/requirements.txt

      # No lint/type-check tool configured for apps/ingestion yet (ARCHITECTURE §12 wants
      # lint -> type-check -> test -> build; these steps are placeholders for when one's added).
      - name: Lint
        run: echo "no lint tool configured for apps/ingestion yet — skipping"
      - name: Type-check
        run: echo "no type-check tool configured for apps/ingestion yet — skipping"

      - name: Apply migrations
        run: python infra/migrate.py

      - name: Test
        working-directory: apps/ingestion
        run: python -m pytest tests -v

      # No bundling step for Python — "build" here means the deployable artifact actually
      # builds (ARCHITECTURE §2's worker runs from this image, per infra/docker-compose.yml).
      - name: Build
        run: docker build -t newstack-ingestion-ci apps/ingestion

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # No hosting target configured yet (mvp-todo.md "Hosting/domain topology" — needs a
      # real small VM per ARCHITECTURE §2). Fill in here once one exists; the job is kept as
      # a no-op placeholder so the pipeline shape matches §12 now.
      - run: echo "deploy target not configured yet"
