# infra/docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: newstack
      POSTGRES_PASSWORD: newstack
      POSTGRES_DB: newstack
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build: ../apps/ingestion
    environment:
      DATABASE_URL: postgresql://newstack:newstack@db:5432/newstack
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ingestion_models:/app/models

  api:
    build: ../apps/api
    environment:
      DATABASE_URL: postgresql://newstack:newstack@db:5432/newstack
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mailer:
    build: ../apps/api
    command: ["node", "dist/mailer/index.js"]
    environment:
      DATABASE_URL: postgresql://newstack:newstack@db:5432/newstack
      WEB_ORIGIN: http://localhost:5173
      # RESEND_API_KEY / MAIL_FROM: unset in dev on purpose — the mailer falls back to the
      # console transport (src/mailer/index.ts). Set both in the real environment to send mail.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ingestion_models:
