# infra/docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: newstack
      POSTGRES_PASSWORD: newstack
      POSTGRES_DB: newstack
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      # context is the repo root, not apps/ingestion: config.py reads config/ at the repo
      # root via a relative path, so the build needs both directories on disk.
      context: ..
      dockerfile: apps/ingestion/Dockerfile
    environment:
      DATABASE_URL: postgresql://newstack:newstack@db:5432/newstack
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ingestion_models:/app/apps/ingestion/models

  api:
    build:
      # context is the repo root, not apps/api: src/features/blindspot/config.ts reads
      # config/ at the repo root via a relative path, so the build needs both on disk.
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://newstack:newstack@db:5432/newstack
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5174
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mailer:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/mailer/index.js"]
    environment:
      DATABASE_URL: postgresql://newstack:newstack@db:5432/newstack
      WEB_ORIGIN: http://localhost:5174
      # RESEND_API_KEY / MAIL_FROM: unset in dev on purpose — the mailer falls back to the
      # console transport (src/mailer/index.ts). Set both in the real environment to send mail.
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      # context is the repo root, not apps/web: apps/web/src imports packages/shared-types
      # via a relative path, so the build needs both directories on disk.
      context: ..
      dockerfile: apps/web/Dockerfile
    # No VITE_API_URL: Vite env vars are resolved at build time, not runtime, and
    # apiClient.ts's default (http://localhost:3000) is already correct here — the browser
    # calls the API directly on the host, never through the compose network, so the
    # container-internal "api" hostname would be wrong even if set.
    ports:
      - "5174:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  ingestion_models:
